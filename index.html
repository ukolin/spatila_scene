<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Spatial Scene - Layered</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
        body { margin: 0; background: #050505; color: #eee; font-family: sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); width: 260px; }
        input[type="range"] { width: 100%; accent-color: #007aff; }
        label { font-size: 11px; color: #888; display: block; margin-top: 10px; }
        #status { font-size: 12px; margin-top: 10px; color: #0f0; text-align: center; }
    </style>
</head>
<body>

<div id="ui">
    <h4 style="margin:0 0 10px 0">Layered Spatial Scene</h4>
    <input type="file" id="upload" accept="image/*">
    
    <label>被写体の拡大率 (穴を隠す量)</label>
    <input type="range" id="subject-scale" min="1.0" max="1.2" step="0.001" value="1.05">
    
    <label>パララックス強度</label>
    <input type="range" id="intensity" min="0" max="0.1" step="0.001" value="0.04">

    <div id="status">画像を選択</div>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0-alpha.13';
    env.allowLocalModels = false;

    let renderer, scene, camera, material;
    let depthEstimator;

    const upload = document.getElementById('upload');
    const status = document.getElementById('status');
    const subScaleUI = document.getElementById('subject-scale');
    const intensityUI = document.getElementById('intensity');

    init();

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        material = new THREE.ShaderMaterial({
            uniforms: {
                u_texture: { value: new THREE.Texture() },
                u_depth: { value: new THREE.Texture() },
                u_offset: { value: new THREE.Vector2(0, 0) },
                u_res: { value: new THREE.Vector2(1, 1) },
                u_screen: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                u_intensity: { value: 0.04 },
                u_subScale: { value: 1.05 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
            `,
            fragmentShader: `
                uniform sampler2D u_texture;
                uniform sampler2D u_depth;
                uniform vec2 u_offset;
                uniform vec2 u_res;
                uniform vec2 u_screen;
                uniform float u_intensity;
                uniform float u_subScale;
                varying vec2 vUv;

                void main() {
                    // アスペクト比補正計算
                    float sAspect = u_screen.x / u_screen.y;
                    float iAspect = u_res.x / u_res.y;
                    vec2 ratio = vec2(min(sAspect / iAspect, 1.0), min(iAspect / sAspect, 1.0));
                    vec2 uv = vUv * ratio + (1.0 - ratio) * 0.5;

                    // 1. 背景レイヤー (ワープあり)
                    float d = texture2D(u_depth, uv).r;
                    vec2 bgUv = uv + u_offset * u_intensity * d;
                    vec4 bgColor = texture2D(u_texture, bgUv);

                    // 2. 被写体レイヤー (手前のものだけ抽出して拡大)
                    // 深度が一定以上の部分を手前とみなす簡易マスク
                    float threshold = 0.5; 
                    float mask = smoothstep(threshold - 0.1, threshold + 0.1, d);
                    
                    // 被写体用のUV (中心から少し拡大)
                    vec2 subUv = (uv - 0.5) / u_subScale + 0.5;
                    // 被写体も背景より少し多めに動かす
                    subUv += u_offset * u_intensity * 1.2; 
                    
                    vec4 subColor = texture2D(u_texture, subUv);

                    // 合成 (手前のマスク部分を上に重ねる)
                    // 被写体レイヤーが拡大されているので、背景の歪みを上から覆い隠す
                    vec4 finalColor = mix(bgColor, subColor, mask);
                    
                    gl_FragColor = finalColor;
                }
            `
        });

        scene.add(new THREE.Mesh(geometry, material));
        animate();
    }

    upload.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        status.innerText = "AI解析中...";

        if (!depthEstimator) {
            depthEstimator = await pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', { device: 'webgpu' });
        }

        const result = await depthEstimator(url);
        
        // テクスチャロード
        new THREE.TextureLoader().load(url, (tex) => {
            material.uniforms.u_res.value.set(tex.image.width, tex.image.height);
            material.uniforms.u_texture.value = tex;
        });

        // 深度マップをぼかしてセット (境界線を馴染ませる)
        const canvas = document.createElement('canvas');
        canvas.width = result.depth.width; canvas.height = result.depth.height;
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(canvas.width, canvas.height);
        for (let i = 0; i < result.depth.data.length; i++) {
            const v = result.depth.data[i];
            imgData.data[i*4]=v; imgData.data[i*4+1]=v; imgData.data[i*4+2]=v; imgData.data[i*4+3]=255;
        }
        ctx.putImageData(imgData, 0, 0);
        ctx.filter = 'blur(4px)'; // 深度エッジをぼかす
        ctx.drawImage(canvas, 0, 0);
        material.uniforms.u_depth.value = new THREE.CanvasTexture(canvas);

        status.innerText = "解析完了";
    });

    window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) - 0.5;
        const y = (e.clientY / window.innerHeight) - 0.5;
        if (material) material.uniforms.u_offset.value.set(x, -y);
    });

    subScaleUI.addEventListener('input', (e) => material.uniforms.u_subScale.value = parseFloat(e.target.value));
    intensityUI.addEventListener('input', (e) => material.uniforms.u_intensity.value = parseFloat(e.target.value));

    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        material.uniforms.u_screen.value.set(window.innerWidth, window.innerHeight);
    });

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
</script>
</body>
</html>
