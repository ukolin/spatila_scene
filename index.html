<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Spatial Scene - v3 (Smooth & Scale)</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
        body { margin: 0; background: #080808; color: #eee; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 100; background: rgba(15, 15, 15, 0.9); padding: 25px; border-radius: 16px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h3 { margin: 0 0 20px 0; font-weight: 300; letter-spacing: 1.5px; color: #fff; text-align: center; }
        
        /* 共通スタイル */
        .control-group { margin-bottom: 18px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 8px; letter-spacing: 0.5px; }
        
        /* ファイル入力 */
        input[type="file"] { width: 100%; font-size: 12px; color: #888; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; }

        /* スライダー */
        input[type="range"] { width: 100%; margin: 0; cursor: pointer; accent-color: #007aff; }

        /* ステータス & プログレス */
        #status { font-size: 12px; min-height: 18px; color: #888; text-align: center; margin-top: 10px; }
        .progress-bar { width: 100%; height: 3px; background: #222; margin-top: 10px; border-radius: 2px; overflow: hidden; display: none; }
        #progress-fill { width: 0%; height: 100%; background: #007aff; transition: width 0.1s; }
    </style>
</head>
<body>

<div id="ui">
    <h3>Spatial Scene</h3>
    
    <div class="control-group">
        <label>1. 画像を選択 (Depth Anything V2で解析)</label>
        <input type="file" id="upload" accept="image/*">
    </div>

    <div class="control-group">
        <label>2. 画像の表示サイズ (画面フィット 基準)</label>
        <input type="range" id="scale-slider" min="0.1" max="1.5" step="0.01" value="1.0">
    </div>

    <div class="control-group">
        <label>3. 奥行きの強度 (パララックス量)</label>
        <input type="range" id="depth-slider" min="0.0" max="0.1" step="0.001" value="0.03">
    </div>

    <div id="status">画像を選択してください</div>
    <div class="progress-bar" id="p-bar"><div id="progress-fill"></div></div>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0-alpha.13';
    
    // 環境設定
    env.allowLocalModels = false;

    let renderer, scene, camera, material, mesh;
    let depthEstimator;
    let currentImageAspect = 1.0;

    const upload = document.getElementById('upload');
    const status = document.getElementById('status');
    const pBar = document.getElementById('p-bar');
    const pFill = document.getElementById('progress-fill');
    const scaleSlider = document.getElementById('scale-slider');
    const depthSlider = document.getElementById('depth-slider');

    init();

    function init() {
        // --- Three.js 基本構成 ---
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // 解像度対応
        document.body.appendChild(renderer.domElement);

        // クアッド（板ポリゴン）
        const geometry = new THREE.PlaneGeometry(2, 2);
        
        // 空間シェーダー
        material = new THREE.ShaderMaterial({
            uniforms: {
                u_texture: { value: new THREE.Texture() },
                u_depth: { value: new THREE.Texture() },
                u_offset: { value: new THREE.Vector2(0, 0) },
                u_intensity: { value: 0.03 }, // 強度を外部化
                u_res: { value: new THREE.Vector2(1, 1) },
                u_screen: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D u_texture;
                uniform sampler2D u_depth;
                uniform vec2 u_offset;
                uniform float u_intensity;
                uniform vec2 u_res;
                uniform vec2 u_screen;
                varying vec2 vUv;

                void main() {
                    // アスペクト比補正 (Cover)
                    float sAspect = u_screen.x / u_screen.y;
                    float iAspect = u_res.x / u_res.y;
                    vec2 ratio = vec2(
                        min(sAspect / iAspect, 1.0),
                        min(iAspect / sAspect, 1.0)
                    );
                    vec2 uv = vUv * ratio + (1.0 - ratio) * 0.5;

                    // 深度サンプリング (ぼかしたテクスチャ)
                    float d = texture2D(u_depth, uv).r;
                    
                    // パララックス量 = ジャイロオフセット * 強度 * 深度
                    vec2 finalUv = uv + u_offset * u_intensity * d;
                    
                    gl_FragColor = texture2D(u_texture, finalUv);
                }
            `
        });

        mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
        
        // 初回のアスペクト比セット
        updateMeshScale();
        render();
    }

    // AI解析 & 画像ロード
    upload.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        pBar.style.display = 'block';
        status.innerText = "AIモデルを準備中...";

        try {
            // 1. AIパイプライン (Depth Anything V2 Small)
            if (!depthEstimator) {
                depthEstimator = await pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', {
                    device: 'webgpu', // WebGPUで爆速解析
                    progress_callback: (p) => {
                        if (p.status === 'progress') {
                            const pct = Math.round(p.progress);
                            pFill.style.width = pct + "%";
                            status.innerText = `モデルをDL中: ${pct}%`;
                        }
                    }
                });
            }

            status.innerText = "深度を推定中...";
            const result = await depthEstimator(url);
            
            // 2. 元画像のロード & アスペクト比取得
            const loader = new THREE.TextureLoader();
            loader.load(url, (tex) => {
                const w = tex.image.width;
                const h = tex.image.height;
                currentImageAspect = w / h;
                material.uniforms.u_res.value.set(w, h);
                material.uniforms.u_texture.value = tex;
                
                // 解析完了後にサイズを更新
                updateMeshScale();
            });

            // 3. 深度マップの処理 (Canvasでぼかしをかける)
            status.innerText = "深度マップを平滑化中...";
            const { width, height, data } = result.depth;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            // 深度データをRGBAに変換してCanvasに描画
            const imgData = ctx.createImageData(width, height);
            for (let i = 0; i < data.length; i++) {
                const v = data[i];
                const ii = i * 4;
                imgData.data[ii] = v; imgData.data[ii+1] = v; imgData.data[ii+2] = v; imgData.data[ii+3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);

            // --- レタッチ技: ガウスぼかしを適用 (エッジを馴染ませる) ---
            // ぼかしの強さ (ピクセル単位)。解像度に合わせて調整
            ctx.filter = `blur(${Math.max(width, height) * 0.01}px)`; 
            // 自身を描画し直してぼかす
            ctx.drawImage(canvas, 0, 0);

            // ぼかしたCanvasをThree.jsのテクスチャにする
            material.uniforms.u_depth.value = new THREE.CanvasTexture(canvas);

            status.innerText = "完了 (マウスを動かしてください)";
            setTimeout(() => { pBar.style.display = 'none'; }, 1000);

        } catch (err) {
            console.error(err);
            status.innerText = "エラー: " + err.message;
        }
    });

    // メッシュのサイズ（スケール）を更新する関数
    function updateMeshScale() {
        if (!mesh || !material) return;
        
        const scale = parseFloat(scaleSlider.value);
        const sAspect = window.innerWidth / window.innerHeight;
        
        // 基本は画面にフィットするサイズ (Object-fit: cover的に)
        mesh.scale.set(1, 1, 1);
        
        // スライダーの値を適用
        mesh.scale.multiplyScalar(scale);
    }

    // UI イベント
    scaleSlider.addEventListener('input', updateMeshScale);
    depthSlider.addEventListener('input', (e) => {
        material.uniforms.u_intensity.value = parseFloat(e.target.value);
    });

    // マウス連動
    window.addEventListener('mousemove', (e) => {
        // マウス位置 (-0.5 〜 0.5)
        const x = (e.clientX / window.innerWidth) - 0.5;
        const y = (e.clientY / window.innerHeight) - 0.5;
        // シェーダー内の offset Uniform に流し込む
        if (material) material.uniforms.u_offset.value.set(x, -y);
    });

    // リサイズ処理
    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        material.uniforms.u_screen.value.set(window.innerWidth, window.innerHeight);
        updateMeshScale();
    });

    function render() {
        requestAnimationFrame(render);
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
