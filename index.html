<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Spatial Scene Proto</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; overflow: hidden; }
        #controls { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; }
        canvas { display: block; }
        #loading { display: none; margin-top: 10px; color: #0f0; }
    </style>
</head>
<body>

<div id="controls">
    <h3>Spatial Scene Proto</h3>
    <input type="file" id="upload" accept="image/*">
    <div id="loading">AI解析中... (初回はモデルをDLします)</div>
    <p style="font-size: 12px; opacity: 0.7;">マウス移動またはスマホ傾斜で動きます</p>
</div>

<script type="module">
    // 最新のパッケージ名に変更（V3系）
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0-alpha.13';
    
    // WebGPU/WASMの最適化設定
    env.allowLocalModels = false;

    let renderer, scene, camera, material;
    let depthEstimator;
    const upload = document.getElementById('upload');
    const loading = document.getElementById('loading');

    initScene();

    async function initScene() {
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        material = new THREE.ShaderMaterial({
            uniforms: {
                u_texture: { value: new THREE.Texture() },
                u_depth: { value: new THREE.Texture() },
                u_offset: { value: new THREE.Vector2(0, 0) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D u_texture;
                uniform sampler2D u_depth;
                uniform vec2 u_offset;
                varying vec2 vUv;
                void main() {
                    float depth = texture2D(u_depth, vUv).r;
                    vec2 displacedUv = vUv + u_offset * depth;
                    gl_FragColor = texture2D(u_texture, displacedUv);
                }
            `
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
        animate();
    }

    upload.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        loading.style.display = 'block';
        loading.innerText = "モデルをロード中... (初回のみ約30MB)";

        try {
            // 最新の公式リポジトリ名を指定
            if (!depthEstimator) {
                depthEstimator = await pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', {
                    device: 'webgpu', // 可能ならGPUを使う
                });
            }

            loading.innerText = "画像を解析中...";
            const output = await depthEstimator(url);
            
            const texLoader = new THREE.TextureLoader();
            material.uniforms.u_texture.value = texLoader.load(url);
            
            // 深度マップをテクスチャ化
            const depthData = output.depth;
            const depthCanvas = document.createElement('canvas');
            depthCanvas.width = depthData.width;
            depthCanvas.height = depthData.height;
            const ctx = depthCanvas.getContext('2d');
            const imageData = ctx.createImageData(depthCanvas.width, depthCanvas.height);
            
            // 1次元データをRGBAに展開
            for (let i = 0; i < depthData.data.length; i++) {
                const val = depthData.data[i];
                const idx = i * 4;
                imageData.data[idx] = val;
                imageData.data[idx + 1] = val;
                imageData.data[idx + 2] = val;
                imageData.data[idx + 3] = 255;
            }
            ctx.putImageData(imageData, 0, 0);
            material.uniforms.u_depth.value = new THREE.CanvasTexture(depthCanvas);

            loading.style.display = 'none';
        } catch (err) {
            console.error(err);
            loading.innerText = "エラーが発生しました: " + err.message;
        }
    });

    window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) - 0.5;
        const y = (e.clientY / window.innerHeight) - 0.5;
        if (material) material.uniforms.u_offset.value.set(x * 0.05, -y * 0.05);
    });

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
