<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Spatial Scene - v2</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #eee; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 100; background: rgba(20, 20, 20, 0.85); padding: 20px; border-radius: 12px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); width: 280px; }
        h3 { margin: 0 0 15px 0; font-weight: 300; letter-spacing: 1px; color: #fff; }
        input[type="file"] { width: 100%; color: #888; }
        #status { margin-top: 15px; font-size: 13px; min-height: 20px; transition: all 0.3s; }
        .progress-bar { width: 100%; height: 4px; background: #333; margin-top: 8px; border-radius: 2px; overflow: hidden; display: none; }
        #progress-fill { width: 0%; height: 100%; background: #007aff; transition: width 0.1s; }
        .hint { font-size: 11px; margin-top: 15px; color: #666; line-height: 1.4; }
    </style>
</head>
<body>

<div id="ui">
    <h3>Spatial Scene</h3>
    <input type="file" id="upload" accept="image/*">
    <div id="status">画像を選択してください</div>
    <div class="progress-bar" id="p-bar"><div id="progress-fill"></div></div>
    <div class="hint">マウスの動きに合わせて、AIが推定した深度に基づきピクセルを微細にオフセットします。</div>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0-alpha.13';
    
    // WebWorkerや外部リソースの読み込み制限を回避
    env.allowLocalModels = false;

    let renderer, scene, camera, material;
    let depthEstimator;

    const upload = document.getElementById('upload');
    const status = document.getElementById('status');
    const pBar = document.getElementById('p-bar');
    const pFill = document.getElementById('progress-fill');

    init();

    function init() {
        // --- Three.js Setup ---
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        material = new THREE.ShaderMaterial({
            uniforms: {
                u_texture: { value: new THREE.Texture() },
                u_depth: { value: new THREE.Texture() },
                u_offset: { value: new THREE.Vector2(0, 0) },
                u_res: { value: new THREE.Vector2(1, 1) },
                u_screen: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D u_texture;
                uniform sampler2D u_depth;
                uniform vec2 u_offset;
                uniform vec2 u_res;
                uniform vec2 u_screen;
                varying vec2 vUv;

                void main() {
                    // アスペクト比補正 (Object-fit: cover)
                    float sAspect = u_screen.x / u_screen.y;
                    float iAspect = u_res.x / u_res.y;
                    vec2 ratio = vec2(
                        min(sAspect / iAspect, 1.0),
                        min(iAspect / sAspect, 1.0)
                    );
                    vec2 uv = vUv * ratio + (1.0 - ratio) * 0.5;

                    // 深度をサンプリング
                    float d = texture2D(u_depth, uv).r;
                    
                    // パララックス（深度に応じたずらし）
                    vec2 finalUv = uv + u_offset * d;
                    
                    gl_FragColor = texture2D(u_texture, finalUv);
                }
            `
        });

        scene.add(new THREE.Mesh(geometry, material));
        render();
    }

    upload.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        pBar.style.display = 'block';
        status.innerText = "モデルを準備中...";

        try {
            // --- AI Pipeline ---
            if (!depthEstimator) {
                depthEstimator = await pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', {
                    device: 'webgpu',
                    progress_callback: (p) => {
                        if (p.status === 'progress') {
                            const pct = Math.round(p.progress);
                            pFill.style.width = pct + "%";
                            status.innerText = `モデルをダウンロード中: ${pct}%`;
                        }
                    }
                });
            }

            status.innerText = "深度を推定中...";
            const result = await depthEstimator(url);
            
            // --- Texture Loading ---
            const loader = new THREE.TextureLoader();
            loader.load(url, (tex) => {
                material.uniforms.u_res.value.set(tex.image.width, tex.image.height);
                material.uniforms.u_texture.value = tex;
            });

            // --- Depth Data Process ---
            const { width, height, data } = result.depth;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(width, height);
            
            for (let i = 0; i < data.length; i++) {
                const v = data[i];
                const ii = i * 4;
                imgData.data[ii] = v; imgData.data[ii+1] = v; imgData.data[ii+2] = v; imgData.data[ii+3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);
            material.uniforms.u_depth.value = new THREE.CanvasTexture(canvas);

            status.innerText = "完了";
            setTimeout(() => { pBar.style.display = 'none'; }, 1000);

        } catch (err) {
            console.error(err);
            status.innerText = "エラー: " + err.message;
        }
    });

    window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) - 0.5;
        const y = (e.clientY / window.innerHeight) - 0.5;
        // プロ推奨の控えめな動き (強度0.03)
        if (material) material.uniforms.u_offset.value.set(x * 0.03, -y * 0.03);
    });

    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        material.uniforms.u_screen.value.set(window.innerWidth, window.innerHeight);
    });

    function render() {
        requestAnimationFrame(render);
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
