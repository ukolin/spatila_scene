<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Spatial Scene - Apple Perspective</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
        body { margin: 0; background: #050505; color: #eee; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 100; background: rgba(15, 15, 15, 0.85); padding: 25px; border-radius: 16px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); width: 300px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        h3 { margin: 0 0 20px 0; font-weight: 300; letter-spacing: 2px; color: #fff; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .control-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .val { float: right; color: #007aff; font-family: monospace; }
        
        input[type="file"] { width: 100%; font-size: 12px; color: #aaa; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border: 1px dashed #444; box-sizing: border-box; cursor: pointer; }
        input[type="range"] { width: 100%; margin: 0; cursor: pointer; accent-color: #007aff; }

        #status { font-size: 12px; min-height: 18px; color: #007aff; text-align: center; margin-top: 15px; font-weight: bold; }
        .progress-bar { width: 100%; height: 4px; background: #222; margin-top: 10px; border-radius: 2px; overflow: hidden; display: none; }
        #progress-fill { width: 0%; height: 100%; background: #007aff; transition: width 0.1s; }
        
        .hint { font-size: 10px; margin-top: 20px; color: #555; line-height: 1.5; text-align: center; }
    </style>
</head>
<body>

<div id="ui">
    <h3>SPATIAL SCENE</h3>
    
    <div class="control-group">
        <label>1. Select Image</label>
        <input type="file" id="upload" accept="image/*">
    </div>

    <div class="control-group">
        <label>2. Zoom Scale <span class="val" id="val-scale">1.00</span></label>
        <input type="range" id="scale-slider" min="0.1" max="2.0" step="0.01" value="1.0">
    </div>

    <div class="control-group">
        <label>3. Spatial Depth <span class="val" id="val-depth">0.05</span></label>
        <input type="range" id="depth-slider" min="0.0" max="0.2" step="0.001" value="0.05">
    </div>

    <div id="status">Waiting for image...</div>
    <div class="progress-bar" id="p-bar"><div id="progress-fill"></div></div>
    
    <div class="hint">Apple-Style Perspective: <br>Stable Foreground & Dynamic Background</div>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0-alpha.13';
    env.allowLocalModels = false;

    let renderer, scene, camera, material, mesh;
    let depthEstimator;

    const upload = document.getElementById('upload');
    const status = document.getElementById('status');
    const pBar = document.getElementById('p-bar');
    const pFill = document.getElementById('progress-fill');
    const scaleSlider = document.getElementById('scale-slider');
    const depthSlider = document.getElementById('depth-slider');

    init();

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        
        material = new THREE.ShaderMaterial({
            uniforms: {
                u_texture: { value: new THREE.Texture() },
                u_depth: { value: new THREE.Texture() },
                u_mouse: { value: new THREE.Vector2(0, 0) },
                u_intensity: { value: 0.05 },
                u_res: { value: new THREE.Vector2(1, 1) },
                u_screen: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                u_scale: { value: 1.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D u_texture;
                uniform sampler2D u_depth;
                uniform vec2 u_mouse;
                uniform float u_intensity;
                uniform vec2 u_res;
                uniform vec2 u_screen;
                uniform float u_scale;
                varying vec2 vUv;

                void main() {
                    // Aspect ratio logic (object-fit: cover)
                    float sAspect = u_screen.x / u_screen.y;
                    float iAspect = u_res.x / u_res.y;
                    vec2 ratio = vec2(
                        min(sAspect / iAspect, 1.0) / u_scale,
                        min(iAspect / sAspect, 1.0) / u_scale
                    );
                    
                    vec2 uv = (vUv - 0.5) * ratio + 0.5;

                    if(uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) discard;

                    // --- Apple Spatial Boost Logic ---
                    float d = texture2D(u_depth, uv).r;
                    
                    // 1. Inverse Parallax (奥ほど動く)
                    // 背景の回り込みを2次関数で強調
                    float moveWeight = pow(1.0 - d, 2.0); 
                    vec2 move = u_mouse * u_intensity * moveWeight * 2.5;

                    // 2. Perspective Expansion (手前の膨張)
                    // 手前にあるものをわずかに大きくして、実在感を出しつつ背景の破綻を隠す
                    float expansion = d * u_intensity * 0.4;
                    vec2 expandedUv = (uv - 0.5) * (1.0 - expansion) + 0.5;

                    vec2 finalUv = expandedUv + move;
                    
                    // Boundary safety
                    finalUv = clamp(finalUv, 0.001, 0.999);
                    
                    gl_FragColor = texture2D(u_texture, finalUv);
                }
            `
        });

        mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
        animate();
    }

    upload.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        pBar.style.display = 'block';
        status.innerText = "Initializing AI...";

        try {
            if (!depthEstimator) {
                depthEstimator = await pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', {
                    device: 'webgpu',
                    progress_callback: (p) => {
                        if (p.status === 'progress') {
                            const pct = Math.round(p.progress);
                            pFill.style.width = pct + "%";
                            status.innerText = `Loading Model: ${pct}%`;
                        }
                    }
                });
            }

            status.innerText = "Estimating Depth Map...";
            const result = await depthEstimator(url);
            
            new THREE.TextureLoader().load(url, (tex) => {
                material.uniforms.u_res.value.set(tex.image.width, tex.image.height);
                material.uniforms.u_texture.value = tex;
                tex.needsUpdate = true;
            });

            const { width, height, data } = result.depth;
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(width, height);
            for (let i = 0; i < data.length; i++) {
                const v = data[i];
                const ii = i * 4;
                imgData.data[ii] = v; imgData.data[ii+1] = v; imgData.data[ii+2] = v; imgData.data[ii+3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);

            // Gaussian Blur for smoothing depth transitions
            ctx.globalCompositeOperation = 'copy';
            ctx.filter = `blur(${Math.max(width, height) * 0.012}px)`; 
            ctx.drawImage(canvas, 0, 0);

            material.uniforms.u_depth.value = new THREE.CanvasTexture(canvas);
            status.innerText = "Analysis Complete";
            setTimeout(() => { pBar.style.display = 'none'; }, 1000);

        } catch (err) {
            status.innerText = "Error: Check WebGPU support";
            console.error(err);
        }
    });

    scaleSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        material.uniforms.u_scale.value = val;
        document.getElementById('val-scale').innerText = val.toFixed(2);
    });
    
    depthSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        material.uniforms.u_intensity.value = val;
        document.getElementById('val-depth').innerText = val.toFixed(3);
    });

    window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) - 0.5;
        const y = (e.clientY / window.innerHeight) - 0.5;
        if (material) material.uniforms.u_mouse.value.set(x, -y);
    });

    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        material.uniforms.u_screen.value.set(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
